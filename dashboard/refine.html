<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refine</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css">
<link rel="stylesheet" href="sections.css">
<link rel="stylesheet" href="page.css">
<style>
.side .top{position:sticky;top:0;z-index:2;background:var(--surface-0);padding-top:2px}
.side .prog{padding:0 10px 10px}
.side .bar{height:3px;border-radius:2px;background:var(--border-soft);overflow:hidden}
.side .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.side .grp .items{padding-left:0}
.side .it{grid-template-columns:36px 1fr 16px}
.side .it .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.side .it .ag{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-right:6px}
.side .it .dn{display:flex;align-items:center;height:17px;color:var(--text-muted);font-size:13px;opacity:.45}
.side .it .dn.done{color:var(--green);opacity:1}
.side .it .dn.half{color:var(--orange);opacity:1}
.side .it .dn.draft{color:var(--text-warning);opacity:.9}
.side .it .dn.na{opacity:.3}
main{display:flex;flex-direction:column}
.ed{order:0;position:sticky;top:16px;z-index:3;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;margin-bottom:12px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
details.card.rep.refine{order:1;margin-bottom:12px}
details.fullcard{order:2;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
details.fullcard>summary{padding:6px 12px;font-size:11.5px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;color:var(--text-muted);cursor:pointer;list-style:none}
details.fullcard>summary::-webkit-details-marker{display:none}
details.fullcard>summary::before{content:"›";display:inline-block;width:12px;transition:transform .18s ease}
details.fullcard[open]>summary::before{transform:rotate(90deg)}
details.fullcard[open]>summary{border-bottom:1px solid var(--border)}
details.fullcard>.card{border:0;border-radius:0}
.ed .ehd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 10px;background:var(--surface-1);border-bottom:1px solid var(--border);border-radius:12px 12px 0 0;font-size:13px;color:var(--text-secondary)}
.ed .ehd .num{font-family:var(--font-mono);font-size:13px}
.ed .ehd .ttl{color:var(--text-primary)}
.ed .ehd .ag{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);margin-left:6px}
.ed .ehd nav{display:flex;gap:12px;align-items:center;white-space:nowrap;font-size:12px}
.ed .ehd nav a{color:var(--text-accent);text-decoration:none}
.ed .ehd nav a.off{color:var(--text-muted);pointer-events:none}
.ed .ehd select.cst{font:inherit;font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);background:var(--surface-0);border:1px solid var(--border);border-radius:6px;padding:1px 4px;outline:none;margin-right:6px}
.ed .ehd select.cst:focus{border-color:var(--border-strong)}
.ed .ehd select.cst.approved{color:var(--green);border-color:color-mix(in srgb,var(--green) 55%,transparent)}
.ed .ehd select.cst.draft{color:var(--orange)}
.ed.na .cells{opacity:.5}
.ed .cells{display:grid;grid-template-columns:1fr 1fr}
.ed .cell{padding:6px 10px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ed .cell:first-child{border-right:1px solid var(--border)}
.ed h4{margin:0;font-size:11.5px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ed h4 .state{font-family:var(--font-mono);text-transform:none;letter-spacing:0;font-weight:400;font-size:11px;color:var(--text-muted);opacity:.7}
.ed .cell.rewritten h4 .state{color:var(--text-accent);opacity:1}
.ed .cell.kept h4 .state{color:var(--green);opacity:1}
.ed .cell.draft h4 .state{color:var(--text-warning);opacity:1}
.ed .was,.ed .chg{font-size:12.5px;color:var(--text-muted);line-height:1.35}
.ed .was::before{content:"card · ";font-family:var(--font-mono);font-size:11px}
.ed .chg{color:var(--text-warning)}
.ed .chg::before{content:"card then · ";font-family:var(--font-mono);font-size:11px}
.ed textarea{font:inherit;font-size:14.5px;line-height:1.4;color:var(--text-primary);background:var(--surface-0);border:1px solid var(--border);border-radius:6px;padding:6px 8px;resize:none;overflow:hidden;min-height:95px;width:100%;box-sizing:border-box;outline:none}
.ed textarea:focus{border-color:var(--border-strong);background:var(--surface-2)}
.ed .cell.rewritten textarea{border-color:var(--text-accent)}
.ed .cell.kept textarea{border-color:color-mix(in srgb,var(--green) 55%,transparent)}
.ed .cell.draft textarea{border-color:color-mix(in srgb,var(--text-warning) 70%,transparent);border-style:dashed}
.ed input.note{font:inherit;font-size:12.5px;color:var(--text-secondary);background:transparent;border:0;border-bottom:1px dashed var(--border);padding:2px 0;outline:none;width:100%;box-sizing:border-box}
.ed input.note:focus{border-bottom-color:var(--border-strong)}
.ed input.note::placeholder{color:var(--text-muted);opacity:.6}
.ed .eft{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--text-muted);font-family:var(--font-mono)}
.ed .eft kbd{font:inherit;background:var(--surface-1);border:1px solid var(--border);border-radius:4px;padding:0 4px;margin:0 1px}
.ed .eft .saved{opacity:0;transition:opacity .25s}
.ed .eft .saved.on{opacity:1;color:var(--green)}
.ed .eft .saved.err{opacity:1;color:var(--text-danger)}
details.fullcard .card .ia .top2{display:none}
.ed .cell.cur{box-shadow:inset 2px 0 0 var(--text-accent)}
.ed.insert .cell.cur{box-shadow:none}
.ed .eft .mode{display:inline-block;font-weight:600;font-size:10.5px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-right:8px;background:var(--bg-accent);color:var(--text-accent)}
.ed.insert .eft .mode{background:var(--bg-success);color:var(--text-success)}
.empty{padding:20px;color:var(--text-secondary);font-size:13.5px}
.empty a{color:var(--text-accent)}
@media (max-width:760px){.ed .cells{grid-template-columns:1fr}.ed .cell:first-child{border-right:0;border-bottom:1px solid var(--border)}.ed{position:static}}
</style>
</head><body>
<div class="app">
<nav class="side">
  <div class="top">
  <div class="hd"><h1><span class="shown" id="prog"></span></h1>
    <div style="display:flex;gap:2px"><button class="fbtn" id="hdone" aria-label="Hide done" title="Hide done"><i class="ti ti-eye-off" aria-hidden="true"></i></button><button class="sbtn" id="hide" aria-label="Hide sidebar" title="Hide sidebar"><i class="ti ti-layout-sidebar-left-collapse" aria-hidden="true"></i></button></div>
  </div>
  <div class="prog"><div class="bar"><i id="barfill"></i></div></div>
  </div>
  <div id="tree"></div>
</nav>
<div class="gut" id="gut" aria-hidden="true"></div>
<main id="view"></main>
</div>
<button class="sbtn show" id="show" aria-label="Show sidebar" title="Show sidebar"><i class="ti ti-layout-sidebar-left-expand" aria-hidden="true"></i></button>
<script src="preact-htm.js"></script>
<script src="card.js"></script>
<script>
(function(){
  // The cells under refinement: key = section/field as the golden files name it, pick = the element on the card.
  var FIELDS=[
    {key:'ia/said',label:"Verdict",pick:function(c){return c.querySelector('.ia .top2 .said')}}
  ];
  var AGENTS=['openpay','cobranzas'];
  var esc=Cards.esc, state={queue:[],golden:{},drafts:{},side:false,key:null,timer:null,sig:null,mode:'normal',cell:0,pend:null};
  function pref(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}
  function route(){var m=/^#k=([a-z]+)\/(\d+)$/.exec(location.hash);return m?{a:m[1],n:+m[2]}:null}
  function href(e){return '#k='+e.a+'/'+e.i.num}
  function text(el){return el?el.textContent.replace(/\s+/g,' ').trim():''}
  function fields(i){var doc=new DOMParser().parseFromString(i.card,'text/html'),out={};FIELDS.forEach(function(f){out[f.key]=text(f.pick(doc))});return out}

  function loadGolden(a,dir){dir=dir||'golden';
    return fetch(dir+'/'+a+'/').then(function(r){return r.ok?r.text():''}).catch(function(){return ''}).then(function(html){
      var nums=[],m,re=/href="(\d+)\.json"/g;while((m=re.exec(html)))nums.push(+m[1]);
      return Promise.all(nums.map(function(n){return fetch(dir+'/'+a+'/'+n+'.json').then(function(r){return r.json()}).catch(function(){return null})}));
    }).then(function(list){var g={};list.forEach(function(d){if(d&&d.issue)g[d.issue]=d});return g});
  }
  function loadExclude(){return fetch('exclude.json').then(function(r){return r.ok?r.json():{}}).then(function(d){return d.out||[]}).catch(function(){return []})}
  function load(){
    return Promise.all([loadExclude()].concat(AGENTS.map(function(a){return Promise.all([Cards.load(a),loadGolden(a),loadGolden(a,'drafts')])}))).then(function(all){
      var out=all[0],rs=all.slice(1),q=[],golden={},drafts={};
      rs.forEach(function(r,k){var a=AGENTS[k];golden[a]=r[1];drafts[a]=r[2];r[0].list.forEach(function(i){if(!i.card||i.orphan||out.indexOf(a+'/'+i.num)>=0)return;var f=fields(i);if(!f['ia/said'])return;q.push({a:a,i:i,cur:f})})});
      q.sort(function(x,y){return x.i.num-y.i.num||x.a.localeCompare(y.a)});
      state.queue=q;state.golden=golden;state.drafts=drafts;return q;
    });
  }
  function rec(e){return (state.golden[e.a]||{})[e.i.num]||null}
  function drec(e){return (state.drafts[e.a]||{})[e.i.num]||null}
  // A draft stands in for a cell only while nothing of Stan's exists for it.
  function draft(e,key){var r=rec(e),d=drec(e);return r&&r.fields&&r.fields[key]?null:(d&&d.fields&&d.fields[key])||null}
  function hasDraft(e){return FIELDS.some(function(f){return !!draft(e,f.key)})}
  function cellStatus(r,key){var f=r&&r.fields&&r.fields[key];return f?f.status:'pending'}
  function itemStatus(e){var r=rec(e),s=FIELDS.map(function(f){return cellStatus(r,f.key)}),d=s.filter(function(x){return x!=='pending'}).length;return d===s.length?'done':d?'half':'pending'}
  var STATES=['approved','draft','n/a'];
  function cardState(e){var r=rec(e);if(r&&r.state)return r.state;var s=itemStatus(e);return s==='done'?'approved':s==='half'?'draft':'pending'}
  function closed(e){var s=cardState(e);return s==='approved'||s==='n/a'}
  function visible(q){var hide=pref('refine:hideDone')==='1',k=route();return q.filter(function(e){return !hide||!closed(e)||(k&&e.a===k.a&&e.i.num===k.n)})}
  function current(){var k=route();return k?state.queue.filter(function(e){return e.a===k.a&&e.i.num===k.n})[0]:null}
  function neighbour(e,dir){var v=visible(state.queue),at=v.indexOf(e);return at<0?null:v[at+dir]||null}
  function go(e){if(e)location.hash=href(e)}

  function save(e,data,dir){dir=dir||'golden';var s=state[dir];
    s[e.a]=s[e.a]||{};s[e.a][e.i.num]=data;
    return fetch(dir+'/'+e.a+'/'+e.i.num+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data,null,1)}).then(function(r){if(!r.ok)throw new Error(r.status)});
  }
  function flash(msg,err){var s=document.getElementById('saved');if(!s)return;s.textContent=msg;s.className='saved '+(err?'err':'on');clearTimeout(state.flash);if(!err)state.flash=setTimeout(function(){s.className='saved'},1200)}
  // mode 'auto': what is typed. A cell back at the card's text with no note is pending again. mode 'accept': pending cells become kept.
  function commit(mode){
    var e=current(),ed=document.getElementById('ed');if(!e||!ed)return Promise.resolve();
    var r=rec(e)||{agent:e.a,issue:e.i.num,fields:{}};r.fields=r.fields||{};var now=new Date().toISOString();
    if(mode==='accept')r.state='approved';
    ed.querySelectorAll('.cell').forEach(function(c){
      var key=c.dataset.f,old=r.fields[key],base=old?old.card:e.cur[key],val=c.querySelector('textarea').value.trim(),same=val.replace(/\s+/g,' ')===base,note=c.querySelector('.note').value.trim(),d=draft(e,key);
      if(mode!=='accept'&&d&&val===(d.golden||'').trim()&&note===(d.note||'').trim())return; // still the draft, untouched
      if(same&&!note){if(mode==='accept')r.fields[key]={card:base,golden:base,note:'',status:'kept',at:now};else delete r.fields[key]}
      else r.fields[key]={card:base,golden:val,note:note,status:same?'kept':'rewritten',at:now};
      var st=cellStatus(r,key);c.className='cell '+st+(c.classList.contains('cur')?' cur':'');c.querySelector('.state').textContent=st;c.querySelector('.was').hidden=val.replace(/\s+/g,' ')===e.cur[key];
    });
    if(!Object.keys(r.fields).length&&!r.state&&!rec(e)){renderSide();return Promise.resolve()} // nothing said about this one yet: no file
    var p=save(e,r);renderSide();
    return p.then(function(){flash('saved')},function(){flash('save failed',true)});
  }
  function setState(v){var e=current();if(!e)return;var r=rec(e)||{agent:e.a,issue:e.i.num,fields:{}};r.state=v;save(e,r).then(function(){flash('saved')},function(){flash('save failed',true)});render()}
  function schedule(){clearTimeout(state.timer);state.timer=setTimeout(function(){commit('auto')},400)}

  function editor(e){
    var r=rec(e),v=visible(state.queue),vi=v.indexOf(e),prev=neighbour(e,-1),next=neighbour(e,1),cs=cardState(e);
    var sel='<select class="cst '+(cs==='n/a'?'na':cs)+'" id="cst" title="Card state"><option value="" disabled'+(cs==='pending'?' selected':'')+'>pending</option>'+STATES.map(function(x){return '<option value="'+x+'"'+(x===cs?' selected':'')+'>'+x+'</option>'}).join('')+'</select>';
    return '<div class="ed'+(cs==='n/a'?' na':'')+'" id="ed"><div class="ehd"><span><span class="num">#'+e.i.num+'</span> <span class="ttl">'+esc(e.i.title)+'</span><span class="ag">'+e.a+'</span></span>'+
      '<nav>'+sel+'<a class="'+(prev?'':'off')+'" href="'+(prev?href(prev):'#')+'">← prev</a><span>'+(vi+1)+' of '+v.length+'</span><a class="'+(next?'':'off')+'" href="'+(next?href(next):'#')+'">next →</a></nav></div>'+
      '<div class="cells">'+FIELDS.map(function(f){
        var fr=r&&r.fields&&r.fields[f.key],d=draft(e,f.key),cur=e.cur[f.key],val=fr?fr.golden:d?d.golden:cur,note=fr?fr.note||'':d?d.note||'':'',st=fr?cellStatus(r,f.key):d?'draft':'pending',chg=fr&&fr.card!==cur,dd=drec(e);
        return '<div class="cell '+st+'" data-f="'+f.key+'"><h4>'+esc(f.label)+'<span class="state">'+esc(d?'draft'+(dd.like?' · like '+dd.like:''):st)+'</span></h4>'+(chg?'<div class="chg">'+esc(fr.card)+'</div>':'')+
          '<div class="was"'+(val.replace(/\s+/g,' ')===cur?' hidden':'')+'>'+esc(cur)+'</div><textarea rows="4" spellcheck="true" lang="es">'+esc(val)+'</textarea><input class="note" placeholder="why · optional" value="'+esc(note)+'"></div>';
      }).join('')+'</div>'+
      '<div class="eft"><span><span class="mode" id="mode"></span><span id="keys"></span></span><span class="saved" id="saved"></span></div></div>';
  }
  function autosize(t){t.style.height='auto';t.style.height=t.scrollHeight+2+'px'}
  function autosizeAll(){document.querySelectorAll('#ed textarea').forEach(autosize)}
  var ro=new ResizeObserver(autosizeAll); // the editor's width moves with the sidebar and the pane; line wraps move with it
  // Like vim's scrolloff: the active row stays inside the middle 30% of the list's viewport (the band below the
  // sticky header); when it leaves the band the list scrolls the minimum that puts it back on the band's edge.
  function reveal(a){
    var n=document.querySelector('nav.side'),hd=n.querySelector('.top'),hh=hd?hd.offsetHeight:0,nr=n.getBoundingClientRect(),ar=a.getBoundingClientRect();
    var vis0=nr.top+hh,visH=n.clientHeight-hh,b0=vis0+visH*.35,b1=vis0+visH*.65;
    if(ar.top<b0)n.scrollTop-=b0-ar.top;else if(ar.bottom>b1)n.scrollTop+=ar.bottom-b1;
  }
  function renderSide(){
    var q=state.queue,cur=current(),done=q.filter(function(e){return cardState(e)==='approved'}).length,total=q.filter(function(e){return cardState(e)!=='n/a'}).length,v=visible(q);
    document.getElementById('prog').textContent=done+' / '+total;
    document.getElementById('barfill').style.width=(total?100*done/total:0)+'%';
    document.getElementById('hdone').classList.toggle('on',pref('refine:hideDone')==='1');
    document.getElementById('tree').innerHTML=v.length?'<div class="grp open"><div class="items">'+v.map(function(e){
        var cs=cardState(e),dr=cs==='pending'&&hasDraft(e),cls=cs==='approved'?'done':cs==='draft'?'half':cs==='n/a'?'na':dr?'draft':'',ico=cs==='approved'?'circle-check':cs==='draft'?'circle-half-2':cs==='n/a'?'circle-off':dr?'circle-dotted':'circle';
        return '<a class="it'+(e===cur?' active':'')+'" href="'+href(e)+'" title="#'+e.i.num+' · '+e.a+' · '+esc(e.i.title)+'"><span class="num">#'+e.i.num+'</span><span class="tt"><span class="ag">'+e.a+'</span>'+esc(e.i.title)+'</span><span class="dn '+cls+'"><i class="ti ti-'+ico+'" aria-hidden="true"></i></span></a>';
      }).join('')+'</div></div>':'<div class="err">Nothing to refine.</div>';
    var a=document.querySelector('.side .it.active');if(a)reveal(a);
  }
  function render(){
    var q=state.queue,k=route(),view=document.getElementById('view');
    if(!k){var first=q.filter(function(e){return !closed(e)})[0]||q[0];if(first){location.replace(href(first));return}}
    var e=current();
    if(!e){renderSide();view.innerHTML='<div class="empty">Not in the set. <a href="#">First pending</a></div>';state.key=null;return}
    var key=e.a+'/'+e.i.num,ed=document.getElementById('ed'),wasInsert=state.mode==='insert',typing=ed&&document.activeElement&&ed.contains(document.activeElement)&&key===state.key;
    renderSide();
    if(typing){ // a card moved under me: refresh the card, leave the editor alone
      var rest=view.querySelectorAll('#view>*:not(#ed)');rest.forEach(function(n){n.remove()});
      view.insertAdjacentHTML('beforeend','<details class="fullcard"><summary>Card</summary><div class="card">'+e.i.card+'</div></details><details class="card rep refine" open><summary>Issue as reported</summary>'+Cards.report(e.i)+'</details>');
    } else {
      view.innerHTML=editor(e)+'<details class="fullcard"><summary>Card</summary><div class="card">'+e.i.card+'</div></details><details class="card rep refine" open><summary>Issue as reported</summary>'+Cards.report(e.i)+'</details>';
      autosizeAll();
    }
    ro.disconnect();ro.observe(view.querySelector('#ed .cells'));
    Cards.unmount();Cards.norm(view,e.i);Cards.applyFolds(view,e.a,e.i.num);Cards.badges(view);
    if(key!==state.key){window.scrollTo({top:0});state.cell=0}
    cursor(state.cell);setMode(wasInsert?'insert':'normal');if(wasInsert&&!typing)edit(false);
    state.key=key;
  }

  var view=document.getElementById('view');
  // Modal like nvim: normal mode moves, insert mode types. Mode follows focus; the footer names the keys of the mode you are in.
  var KEYS={normal:'<kbd>j</kbd><kbd>k</kbd> issue · <kbd>h</kbd><kbd>l</kbd> cell · <kbd>i</kbd> edit · <kbd>n</kbd> note · <kbd>u</kbd> revert · <kbd>s</kbd> state · <kbd>↩</kbd> accept · <kbd>za</kbd> card · <kbd>gg</kbd><kbd>G</kbd> ends · <kbd>t</kbd> done',
            insert:'<kbd>esc</kbd> normal · <kbd>↩</kbd> new line · <kbd>⇥</kbd> next field · <kbd>⌘↩</kbd> accept &amp; next'};
  function inInput(){var a=document.activeElement;return !!(a&&a.closest&&a.closest('#ed')&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'))}
  function setMode(m){state.mode=m;var ed=document.getElementById('ed');if(!ed)return;ed.classList.toggle('insert',m==='insert');ed.querySelector('#mode').textContent=m.toUpperCase();ed.querySelector('#keys').innerHTML=KEYS[m]}
  function cursor(k){state.cell=Math.max(0,Math.min(FIELDS.length-1,k));document.querySelectorAll('#ed .cell').forEach(function(c,i){c.classList.toggle('cur',i===state.cell)})}
  function edit(note){var c=document.querySelectorAll('#ed .cell')[state.cell];if(!c)return;var t=c.querySelector(note?'.note':'textarea');t.focus();t.setSelectionRange(t.value.length,t.value.length);setMode('insert')}
  function revert(){var e=current(),c=document.querySelectorAll('#ed .cell')[state.cell];if(!e||!c)return;var t=c.querySelector('textarea'),key=c.dataset.f;
    var d=drec(e);if(d&&d.fields&&d.fields[key]){delete d.fields[key];save(e,d,'drafts');c.querySelector('.state').textContent='pending'}
    t.value=e.cur[key];c.querySelector('.note').value='';autosize(t);clearTimeout(state.timer);commit('auto')}
  function accept(){clearTimeout(state.timer);var e=current();commit('accept');go(neighbour(e,1))}
  view.addEventListener('focusin',function(ev){var c=ev.target.closest&&ev.target.closest('#ed .cell');if(c){cursor(Array.prototype.indexOf.call(c.parentNode.children,c));setMode('insert')}});
  view.addEventListener('focusout',function(){setTimeout(function(){if(!inInput())setMode('normal')},0)});
  view.addEventListener('input',function(ev){var t=ev.target;if(!t.closest('#ed'))return;if(t.tagName==='TEXTAREA')autosize(t);schedule()});
  view.addEventListener('keydown',function(ev){
    if(!inInput())return;
    if(ev.key==='Escape'){ev.preventDefault();ev.target.blur();setMode('normal')}
  });
  var side=document.querySelector('.side');
  side.addEventListener('pointerenter',function(){state.side=true});
  side.addEventListener('pointerleave',function(){state.side=false});
  side.addEventListener('click',function(ev){if(ev.target.closest('.it'))state.side=true});
  view.addEventListener('pointerdown',function(){state.side=false});
  document.addEventListener('keydown',function(ev){
    if((ev.metaKey||ev.ctrlKey)&&ev.key==='Enter'){ev.preventDefault();accept();return}
    if(ev.key==='Enter'&&!ev.altKey&&!inInput()&&(state.side||document.activeElement.closest('.side'))){ev.preventDefault();state.side=false;cursor(0);edit(false);return}
    if(ev.altKey&&(ev.key==='ArrowDown'||ev.key==='ArrowUp')){ev.preventDefault();clearTimeout(state.timer);commit('auto');go(neighbour(current(),ev.key==='ArrowDown'?1:-1));return}
    if(inInput()){if(state.mode!=='insert')setMode('insert');return}
    if(ev.metaKey||ev.ctrlKey||ev.altKey||/^(A|BUTTON|SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName))return;
    var k=ev.key,p=state.pend,q=visible(state.queue);state.pend=null;clearTimeout(state.pendT);state.side=false;
    if(p==='g'&&k==='g')go(q[0]);
    else if(p==='z'&&k==='a'){var f=document.querySelector('details.fullcard');if(f)f.open=!f.open}
    else if(k==='j')go(neighbour(current(),1));
    else if(k==='k')go(neighbour(current(),-1));
    else if(k==='h')cursor(state.cell-1);
    else if(k==='l')cursor(state.cell+1);
    else if(k==='i')edit(false);
    else if(k==='n')edit(true);
    else if(k==='u')revert();
    else if(k==='s'){var e=current();if(e)setState(STATES[(STATES.indexOf(cardState(e))+1)%STATES.length])}
    else if(k==='Enter')accept();
    else if(k==='G')go(q[q.length-1]);
    else if(k==='t'){pref('refine:hideDone',pref('refine:hideDone')==='1'?'0':'1');render()}
    else if(k==='g'||k==='z'){state.pend=k;state.pendT=setTimeout(function(){state.pend=null},800)}
    else return;
    ev.preventDefault();
  });
  view.addEventListener('change',function(ev){if(ev.target.id==='cst'){var v=ev.target.value;ev.target.blur();if(v)setState(v)}});
  view.addEventListener('toggle',function(ev){var e=current();if(e)Cards.foldToggle(this,e.a,e.i.num,ev.target)},true);
  document.getElementById('hdone').addEventListener('click',function(){pref('refine:hideDone',pref('refine:hideDone')==='1'?'0':'1');render()});
  // Cards change under me while lanes work: every 2 s, HEAD every card of both agents; on a change reload and re-render.
  // The issues listing is part of the signature too: a listing that failed once (server restart) would otherwise
  // leave every card an orphan and the queue empty until a manual reload.
  function poll(){
    Promise.all(AGENTS.map(function(a){var base='agents/'+a+'/cards/';return Promise.all([fetch(base).then(function(r){return r.ok?r.text():''}).catch(function(){return ''}).then(function(ls){
      var files=[],m,re=/href="(\d+)\/"/g;while((m=re.exec(ls)))files.push(m[1]+'/card.html');
      return Promise.all(files.map(function(f){return fetch(base+f,{method:'HEAD'}).then(function(r){return a+'/'+f+'@'+r.headers.get('Last-Modified')+'/'+r.headers.get('Content-Length')}).catch(function(){return f+'@?'})}));
    }),fetch('agents/'+a+'/issues/').then(function(r){return r.ok?r.text():''}).catch(function(){return ''}).then(function(ls){return (ls.match(/href="\d+\.json"/g)||[]).join()})])})).then(function(sig){sig=sig.join('\n');if(state.sig!==null&&state.sig!==sig){AGENTS.forEach(function(a){delete Cards.cache[a]});load().then(render)}state.sig=sig}).catch(function(){}).then(function(){setTimeout(poll,2000)});
  }
  Cards.chrome();
  window.addEventListener('hashchange',render);
  load().then(function(){render();setTimeout(poll,2000)});
})();
</script>
</body></html>
